<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Room Details | Amihan Cove Resort</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07151a;
      --panel: #0f2430;
      --text: #f4f6f7;
      --muted: #b5c7cd;
      --accent: #ffb84d;
      --accent-2: #2db1aa;
      --border: rgba(255,255,255,0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--bg), #0b2b35 55%, #13333d);
      color: var(--text);
      min-height: 100vh;
    }
    .page-shell { max-width: 1120px; margin: 0 auto; padding: 32px 20px 80px; }
    .card {
      border: 1px solid var(--border);
      background: rgba(15,36,48,0.88);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      backdrop-filter: blur(14px);
    }
    .hero-img { width: 100%; height: 420px; object-fit: cover; display: block; }
    .content { padding: 24px 28px 28px; }
    .top-row { display: flex; justify-content: space-between; gap: 16px; align-items: start; flex-wrap: wrap; }
    .eyebrow { color: #8fe6d9; font-weight: 600; text-transform: uppercase; letter-spacing: .2em; font-size: .78rem; }
    h1 { margin: 6px 0 10px; font-size: clamp(1.6rem, 3vw, 2.3rem); }
    .muted { color: var(--muted); line-height: 1.7; }
    .price { font-size: 1.35rem; font-weight: 700; color: var(--accent); }
    .meta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; color: var(--muted); }
    .pill { display: inline-flex; align-items: center; padding: 7px 11px; border-radius: 999px; background: rgba(45,177,170,0.16); color: #8fe6d9; font-size: .9rem; }
    .amenities { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .amenities span { padding: 7px 10px; border-radius: 999px; background: rgba(255,184,77,0.12); color: #ffd08c; font-size: .85rem; }
    .actions { margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap; }
    .btn { text-decoration: none; color: var(--bg); font-weight: 700; padding: 10px 16px; border-radius: 999px; background: linear-gradient(135deg, var(--accent), #ffc96e); }
    .btn.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .empty { padding: 32px; text-align: center; color: var(--muted); }
    @media (max-width: 700px) { .hero-img { height: 280px; } }
  </style>
</head>
<body>
  <div class="page-shell">
    <div class="card" id="roomDetailCard">
      <div class="empty">Loading room details…</div>
    </div>
  </div>

  <script>
    async function loadRoomDetails() {
      const card = document.getElementById('roomDetailCard');
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) {
        card.innerHTML = '<div class="empty">No room selected.</div>';
        return;
      }

      try {
        const res = await fetch(`/api/rooms/${id}`);
        if (!res.ok) throw new Error('Room not found');
        const room = await res.json();

        const image = room.image || 'img/rooms/1.png';
        const amenities = Array.isArray(room.amenities) ? room.amenities : [];
        const status = room.available === false ? 'Currently unavailable' : 'Available for booking';

        card.innerHTML = `
          <img class="hero-img" src="${image}" alt="${room.name || 'Room'}">
          <div class="content">
            <div class="top-row">
              <div>
                <div class="eyebrow">${room.type || 'Resort Room'}</div>
                <h1>${room.name || 'Room'}</h1>
                <div class="muted">${room.description || 'A relaxing retreat designed for comfort and scenic views.'}</div>
              </div>
              <div class="price">From PHP ${Number(room.pricePerNight || 0).toLocaleString()} / night</div>
            </div>
            <div class="meta">
              <span class="pill">👥 ${room.capacity || 2} guests</span>
              <span class="pill">🌊 Oceanfront comfort</span>
              <span class="pill">✨ ${status}</span>
            </div>
            <div class="amenities">${amenities.map(item => `<span>${item}</span>`).join('')}</div>
            <div class="actions">
              <a class="btn" href="rooms.html">Back to rooms</a>
              <a class="btn secondary" href="index.html">Return home</a>
            </div>
          </div>
        `;
      } catch (err) {
        console.error(err);
        card.innerHTML = '<div class="empty">Unable to load room details right now.</div>';
      }
    }

    loadRoomDetails();
  </script>
</body>
</html>
